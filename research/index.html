<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="可搜尋、可探索關聯的個人研究知識庫" />
    <meta name="theme-color" content="#0b0c11" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c3aed'/%3E%3Cpath d='M9 7h8a6 6 0 0 1 0 12H9m0-12v19m8-7 7 7' stroke='white' fill='none' stroke-width='3'/%3E%3C/svg%3E" />
    <title>Research Vault</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body><nav aria-label="公開入口"><a href="../">回公開首頁</a></nav>
    <div class="app-shell">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="sidebar-toggle" aria-label="開啟檔案列表">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="brand" id="home-button" aria-label="回到研究索引">
          <span class="brand-mark">R</span><strong>Research Vault</strong>
        </button>
        <span class="topbar-path" id="topbar-path">Research Index</span>
        <div class="topbar-spacer"></div>
        <button class="top-search" id="search-trigger" aria-label="搜尋知識庫">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <span>搜尋</span><kbd>⌘ K</kbd>
        </button>
        <button class="icon-button" id="graph-open" aria-label="開啟關聯圖譜" title="關聯圖譜">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="m8 7 8-.7M7.2 8.7l3.7 7.5m5.8-8.5-3.5 8.5"/></svg>
        </button>
        <button class="icon-button" id="theme-toggle" aria-label="切換明暗主題" title="切換明暗主題">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="mobile-menu icon-button" id="inspector-toggle" aria-label="開啟筆記資訊">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </header>

      <aside class="sidebar" id="sidebar">
        <div class="vault-heading">
          <div><span class="eyebrow">VAULT</span><strong id="vault-name">ResearchData</strong></div>
          <span class="sync-dot" title="靜態快照"></span>
        </div>
        <div class="sidebar-tabs" role="tablist" aria-label="瀏覽方式">
          <button class="sidebar-tab active" data-sidebar-tab="files" role="tab">檔案</button>
          <button class="sidebar-tab" data-sidebar-tab="tags" role="tab">標籤</button>
        </div>
        <div class="sidebar-panel" id="files-panel">
          <div class="tree-root"><span class="chevron">⌄</span><span>ResearchData</span><span class="count" id="note-count">0</span></div>
          <nav id="note-list" class="note-list" aria-label="筆記清單"></nav>
        </div>
        <div class="sidebar-panel hidden" id="tags-panel">
          <div class="tag-summary"><span>全部標籤</span><button id="clear-tag" class="text-button hidden">清除篩選</button></div>
          <div id="tag-list" class="tag-list"></div>
        </div>
        <div class="vault-stats" id="vault-stats"></div>
      </aside>

      <div class="drawer-scrim" id="drawer-scrim"></div>

      <main class="workspace" id="workspace">
        <section class="snapshot-banner" aria-label="快照狀態"><p id="snapshot-status">正在驗證快照…</p><button id="reload-snapshot">重新讀取</button><p id="load-error" role="alert"></p></section>
        <article class="note-card" id="note-card">
          <header class="note-header">
            <div class="note-kicker" id="note-kicker"></div>
            <h1 id="note-title">正在載入知識庫…</h1>
            <div class="note-tags" id="note-tags"></div>
          </header>
          <div id="note-content" class="note-content" aria-live="polite"><div class="loading-line"></div><div class="loading-line short"></div></div>
          <nav class="note-pagination" id="note-pagination" aria-label="上一篇與下一篇"></nav>
        </article>
      </main>

      <aside class="inspector" id="inspector">
        <div class="inspector-tabs" role="tablist" aria-label="筆記資訊">
          <button class="inspector-tab active" data-inspector-tab="outline" role="tab">大綱</button>
          <button class="inspector-tab" data-inspector-tab="links" role="tab">關聯</button>
          <button class="inspector-tab" data-inspector-tab="info" role="tab">資訊</button>
        </div>
        <div class="inspector-panel" id="outline-panel"><nav id="outline" class="outline"></nav></div>
        <div class="inspector-panel hidden" id="links-panel">
          <section><div class="section-label">反向連結 <span id="backlink-count">0</span></div><div id="backlinks" class="link-list"></div></section>
          <section><div class="section-label">提及的筆記</div><div id="outgoing-links" class="link-list"></div></section>
        </div>
        <div class="inspector-panel hidden" id="info-panel"><dl class="properties" id="properties"></dl></div>
        <button class="graph-card" id="graph-card" aria-label="展開關聯圖譜">
          <div class="graph-card-heading"><span>局部關聯圖</span><span>展開 ↗</span></div>
          <canvas id="mini-graph"></canvas>
        </button>
      </aside>

      <footer class="statusbar">
        <span id="status-note">0 篇筆記</span><span>Markdown</span><span class="status-spacer"></span><span id="status-words">0 字</span><span id="status-updated"></span>
      </footer>
    </div>

    <dialog class="search-dialog" id="search-dialog">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜尋標題、內容或標籤…" aria-label="搜尋標題、內容或標籤" />
        <kbd>ESC</kbd>
      </div>
      <div class="search-hint" id="search-hint">輸入關鍵字，搜尋整個知識庫</div>
      <div class="search-results" id="search-results"></div>
      <div class="dialog-footer"><span>↑↓ 選擇</span><span>↵ 開啟</span></div>
    </dialog>

    <dialog class="graph-dialog" id="graph-dialog">
      <header class="dialog-header">
        <div><span class="eyebrow">KNOWLEDGE GRAPH</span><h2>知識關聯圖譜</h2></div>
        <button class="icon-button" data-close-dialog="graph-dialog" aria-label="關閉圖譜">×</button>
      </header>
      <div class="graph-legend"><span><i></i>筆記</span><span><i class="legend-tag"></i>標籤</span><span>點選節點開啟筆記</span></div>
      <canvas id="full-graph"></canvas>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
